# The shipped profiles: the lowest layer of the resolution (overhaul-r1 §2.1).
# A profile is a role. The engine's measured window decides the window, and with
# no reading yet the model does (the `models:` table); the
# role decides the ceilings within it: `ceilings` on a 200k window, `ceilings_1m`
# on a 1M window. A user or project layer that sets `ceilings` sets them on both
# windows and wins over the role (models.py, resolver.py).
# `defaults` carries every field; a profile names only what it changes, except
# frontier, which states every field so the whole shape is readable in one place.
# `tiers` (packet mt1, hq design/13 §3) maps the five roles to {model, effort}: the
# shipped table is in `defaults`; a profile names only the roles it changes, and the five
# whose body said `subagents: opus` state `build` (mt1 R2-F2), so a start that names them
# re-applies it above every file, as it re-applies their other fields. `subagents`
# is read as `tiers.build`'s model one release more, and `start` exports that model as
# CLAUDE_CODE_SUBAGENT_MODEL. `lane`, `plugins` and `notes` are `start`'s (the former
# sessionconfig table, folded here).
# Strict YAML subset (D12): mappings, scalars, flat lists, one-level flow maps.

# The window each model family runs on. A model string names its family
# (`claude-opus-5-5` is opus); `<family>-1m` is the family under Claude Code's
# 1M marker (`opus[1m]`), spelled so because a key holds no brackets.
# The table answers only before the engine's first measure (a reading outranks it,
# a user layer's entry included), and there 180k fits under either window. So it is
# deliberately cautious: it keys on the family, not the version, and
# reads 200k for a family unless every model this setup runs in it has 1M. As of
# 2026-10-14 Anthropic's "Context windows" page gives 1M to Fable and Mythos, Opus 4.6
# and later, Sonnet 4.6 and later, and Haiku 5.5, and 200k to Sonnet 4.5 and older; the
# Claude Code "Model configuration" page says Claude Code runs Fable, Sonnet 5 and later,
# Haiku 5.5 and Opus 4.7 and later on 1M by default, needs `[1m]` for Opus 4.6 and
# Sonnet 4.6, and auto-compacts a 1M model at about 967K tokens. So a plain `opus`,
# `sonnet` or `haiku` may run on 1M while this table reads 200k. Only the orchestrator
# roles differ by window (180k on 200k, 400k on 1M; every other role keeps 180k on
# both), so the cautious reading costs an orchestrator its 400k until the first reading
# unless its model is named `fable` or `opus[1m]`.
models:
  fable: 1000000
  mythos: 1000000
  opus: 200000
  opus-1m: 1000000
  sonnet: 200000
  haiku: 200000

defaults:
  description: ""
  model: opus
  effort: high
  tiers:
    design: {model: fable, effort: high}
    build: {model: opus, effort: high}
    words: {model: sonnet, effort: medium}
    mend: {model: sonnet, effort: high}
    lookup: {model: haiku, effort: low}
  lane: seat
  plugins: []
  notes: ""
  tools: null
  permission_mode: auto
  posture: signal
  ceilings: {context: 180000, turns: 400}
  ceilings_1m: {context: 180000, turns: 400}
  checkpoint_at: 0.8
  builders: {model: opus, max_concurrent: 3}
  push: never
  device: never
  charter: {dir: history/sittings, required: true}
  verify: null
  respawn: {cap: 20, floor: 600, settle: 60}
  # The priority and pacing every sitting meets (rules.py, `agentik session rules`).
  # Each level text is quoted: it holds ": ". A layer replaces one level's text;
  # the names S1 to S4 and their count are fixed.
  priority:
    enabled: true
    levels:
      S1: "harm: a reproduced bug that can do harm (a wrong write, data loss, a leaked secret, a safety path) or the repo's own gate red on main; it goes first, ahead of the current goal"
      S2: "blocks the goal: an unmet acceptance criterion of the current goal, a defect in a new user's first run, or a dependency that holds the goal"
      S3: "the build order: the goal's next slice, then the repo's pending list"
      S4: "the rest: review notes, polish, refactors, docs; filed in NICE_TO_HAVE.md with its level, taken on an S3 slice's path, or while fill is on; never ahead of S3"
  pacing: {enabled: true, fallback: 1800, waiting: 3, meter_line_minutes: 30}
  respeak: {narrative: tech}
  relay: {enabled: auto, queue: relay/queue.yaml, merge: merge-on-green}

profiles:
  frontier:
    description: Everything on the seat, full effort. For work that matters.
    model: opus
    effort: high
    tiers:
      build: {model: opus}
    tools: null
    permission_mode: auto
    posture: signal
    ceilings: {context: 180000, turns: 400}
    ceilings_1m: {context: 180000, turns: 400}
    checkpoint_at: 0.8
    builders: {model: opus, max_concurrent: 3}
    push: never
    device: never
    charter: {dir: history/sittings, required: true}
    verify: null
    respeak: {narrative: tech}
    relay: {enabled: auto}
    plugins: [respeak]
    notes: "Frontier resources. Spend them on judgement, not bulk retrieval."
  balanced:
    description: Opus main thread, Sonnet subagents. The everyday default.
    effort: high
    tiers:
      build: {model: sonnet}
    plugins: [respeak]
  local:
    description: Seat main thread, local subagents (serialised) via `agentik-agents local`.
    effort: high
    lane: local
    notes: "Subagent routing is the local lane's: Explore runs on the local 27B, broad-tool agents stay on the seat. The local backend runs at concurrency 1, so local subagents are SERIALISED; fanning out ten of them is ten sequential runs, not a parallel sweep. Send a small number of small-tool-list agents down for bulk retrieval and summarisation; keep judgement and any real parallelism on the seat."
  local-only:
    description: Main thread and subagents on the local model. Zero seat spend.
    model: local/default
    effort: medium
    tiers:
      design: {model: local/default}
      build: {model: local/default}
      words: {model: local/default}
      mend: {model: local/default}
      lookup: {model: local/default}
    lane: local-only
    posture: "off"
    notes: "Everything is running on the local model, including agents with broad tool lists that are known to be slow there; that is the point of this configuration, not an oversight. Nothing touches the claude.ai seat, so the usage window is not the constraint; local latency is. The backend is concurrency 1, so subagents run one at a time. Prefer short turns and small tool lists, and expect effort to be capped at medium."
  scratch:
    description: A test project. Local, low ceremony, nothing enforced.
    model: local/default
    effort: low
    tiers:
      design: {model: local/default}
      build: {model: local/default}
      words: {model: local/default}
      mend: {model: local/default}
      lookup: {model: local/default}
    lane: local-only
    posture: "off"
    charter: {required: false}
  review:
    description: Read-only review posture. Investigates, never edits.
    tools: [Read, Glob, Grep]
    permission_mode: plan
    plugins: [respeak]
    notes: "Read-only. Produce findings and a plan; do not edit files."
  packets:
    description: Writes packets and designs, never builds.
    model: fable
    effort: high
    tiers:
      build: {model: opus}
    posture: signal
  builder:
    description: What the relay spawns.
    model: opus
    effort: high
    tiers:
      build: {model: opus}
    posture: deny
  orchestrator:
    description: The orchestrator for large, complex work, Fable on its 1M window. A continuous loop; at the checkpoint it brings its charter current and respawns.
    model: fable
    effort: high
    builders: {model: opus, max_concurrent: 3}
    tiers:
      build: {model: opus}
    posture: signal
    charter: {required: true}
    ceilings: {context: 180000, turns: 400}
    ceilings_1m: {context: 400000, turns: 400}
  orchestrator-opus:
    description: The orchestrator for small and medium projects, Opus on its 1M window. A continuous loop; at the checkpoint it brings its charter current and respawns.
    model: opus[1m]
    effort: high
    tiers:
      design: {model: opus}
      build: {model: opus}
    builders: {model: opus, max_concurrent: 3}
    posture: signal
    charter: {required: true}
    ceilings: {context: 180000, turns: 400}
    ceilings_1m: {context: 400000, turns: 400}
